<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة الخدمات | أمانة منطقة عسير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --brown:#3A2016; --brown-deep:#26140D; --sand:#D8C4A8;
  --ground:#F6F3EF; --surface:#FFFFFF; --soft:#F1EBE3; --ink:#22140E; --muted:#6B5D55; --line:#E7DFD6;
  --orange:#E07A2E; --red:#C9372C; --green:#2E9A55; --blue:#3A8BC8;
  --hero:#FFFFFF; --glyph:rgba(58,32,22,.13);
  --shadow:0 1px 2px rgba(58,32,22,.05),0 10px 28px rgba(58,32,22,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#18110D; --surface:#221813; --soft:#2E221B; --ink:#F3ECE4; --muted:#BDAEA2; --line:#3A2C24;
    --hero:#221813; --glyph:rgba(243,236,228,.10); --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#18110D; --surface:#221813; --soft:#2E221B; --ink:#F3ECE4; --muted:#BDAEA2; --line:#3A2C24;
  --hero:#221813; --glyph:rgba(243,236,228,.10); --shadow:0 1px 2px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{background:#fff;border-bottom:1px solid #E7DFD6}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.top img{height:46px;width:auto}
.me{display:flex;align-items:center;gap:10px;color:#22140E}
.avatar{width:40px;height:40px;border-radius:50%;background:#3A2016;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.me-name{font-size:14px;font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid #E7DFD6;background:#fff;color:#22140E;display:inline-grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:#3A2016}

/* hero */
.hero{margin-top:24px;position:relative;background:var(--hero);border:1px solid var(--line);border-radius:32px;overflow:hidden;isolation:isolate}
.mosaic{position:absolute;inset:0;z-index:-1;--mx:22%;--my:45%;--r:170px;-webkit-mask-image:linear-gradient(to left,transparent 32%,#000 74%);mask-image:linear-gradient(to left,transparent 32%,#000 74%)}

nt 100%);animation:driftBg 48s linear infinite}
@keyframes driftMask{to{-webkit-mask-position:0 329px;mask-position:0 329px}}
@keyframes driftBg{to{background-position:0 329px}}
.hero-in{padding:44px 48px 40px;max-width:700px}
.date{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:500}
.hero h1{margin:0;font-size:clamp(30px,3.6vw,44px);line-height:1.25;font-weight:700;letter-spacing:-.3px}

.cmd{position:relative;margin-top:24px}
.cmd-box{display:flex;align-items:center;gap:12px;height:60px;padding:0 18px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.cmd-box:focus-within{border-color:var(--brown);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 18%,transparent),var(--shadow)}
.cmd-box input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:17px}
.cmd-box input::placeholder{color:var(--muted)}
.cmd-box input::-webkit-search-cancel-button{display:none}
kbd{font:inherit;font-size:13px;font-weight:600;min-width:28px;height:28px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:var(--soft)}
.results{position:absolute;inset-inline:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(38,20,13,.18);padding:8px;z-index:20;display:none;max-height:400px;overflow:auto}
.results.show{display:block}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;text-align:start;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--soft)}
.res .t{font-weight:600;font-size:15px;display:block}
.res .d{font-size:13px;color:var(--muted);line-height:1.5;display:block}
.res .why{margin-inline-start:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.res-empty{padding:14px;color:var(--muted);font-size:14px}

.stats{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px 0 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.stat:hover{border-color:color-mix(in srgb,var(--brown) 50%,var(--line))}
.stat[aria-pressed="true"]{background:var(--brown);border-color:var(--brown);color:#fff}
.stat b{font-size:20px;font-weight:700;line-height:1}
.stat span{font-size:14px;font-weight:500}
.stat i{width:9px;height:9px;flex:none;clip-path:polygon(50% 0,100% 100%,0 100%)}

/* sections */
main{padding-bottom:72px}
.sec{margin-top:40px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{margin:0;font-size:22px;font-weight:700}
.sec-head .sub{font-size:14px;color:var(--muted);margin-inline-start:10px;font-weight:400}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--brown)}
.btn.gold{background:var(--sand);border-color:var(--sand);color:#22140E}
.btn.ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.link{border:0;background:transparent;padding:0 2px;height:40px}
.btn.link:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface)}
.seg button{width:40px;height:36px;border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}

/* pinned strip */
.pins{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.pin{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;transition:transform .25s,border-color .25s,box-shadow .25s;overflow:hidden}
.pin:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:var(--shadow)}
.pin .rk{position:absolute;top:14px;inset-inline-end:16px;font-size:13px;font-weight:700;color:var(--muted)}
.pin .nm{font-size:15px;font-weight:700;line-height:1.45}
.pin::after{content:"";position:absolute;bottom:0;inset-inline-start:0;height:3px;width:0;background:var(--c);transition:width .35s ease}
.pin:hover::after{width:100%}

/* tiles */
.tile{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--tb);color:var(--tf);transition:transform .35s cubic-bezier(.2,.8,.2,1.3)}
.pin:hover .tile,.card:hover .tile,.row:hover .tile{transform:rotate(-7deg) scale(1.06)}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .25s,transform .25s,box-shadow .25s;overflow:hidden}
.card::before{content:"";position:absolute;top:0;inset-inline-start:24px;width:16px;height:10px;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%);transform:translateY(-10px);transition:transform .3s cubic-bezier(.2,.8,.2,1.3)}
.card:hover,.card:focus-within{border-color:color-mix(in srgb,var(--c) 55%,var(--line));transform:translateY(-2px);box-shadow:var(--shadow)}
.card:hover::before,.card:focus-within::before{transform:translateY(0)}
.c-top{display:flex;align-items:center;gap:12px}
.c-top h3{margin:0;flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.45}
.rank{flex:none;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:8px;padding:1px 8px}
.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brief{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.brief>div{overflow:hidden}
.brief.open{grid-template-rows:1fr}
.brief .in{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.85}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chev{transition:transform .3s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.go{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:var(--soft);color:var(--ink);border:0;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.card:hover .go,.row:hover .go{background:var(--brown);color:#fff}
.go:hover{transform:translateX(-3px)}

/* list rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{border-bottom:1px solid var(--line);transition:background .2s}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--soft) 60%,var(--surface))}
.row-main{display:flex;align-items:center;gap:14px;padding:10px 16px}
.row .tile{width:40px;height:40px;border-radius:12px}
.row .nm{flex:0 0 220px;font-weight:700;font-size:15px}
.row .ds{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .brief .in{margin:0 16px 14px 70px}

/* locked */
.card.locked{border-style:dashed;background:transparent}
.card.locked .tile,.row.locked .tile{background:var(--soft);color:var(--muted);position:relative}
.lockb{position:absolute;bottom:-5px;inset-inline-start:-5px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--ground);display:grid;place-items:center;border:2px solid var(--ground)}
.sent{height:40px;padding:0 12px;border-radius:12px;background:#DCEFE2;color:#1D6438;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.req{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--ink);background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.req:hover{background:var(--ink);color:var(--ground)}
.divider{display:flex;align-items:center;gap:12px;margin:28px 0 14px;font-size:15px;font-weight:700}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider small{font-weight:400;color:var(--muted);font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px}

/* edit */
.editbar{position:sticky;top:12px;z-index:30;margin-top:24px;background:var(--brown-deep);color:#fff;border-radius:20px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 18px 40px rgba(38,20,13,.35)}
.editbar .msg{display:flex;gap:12px;align-items:center;flex:1 1 380px}
.editbar .mk{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sand);color:#22140E;display:grid;place-items:center}
.editbar small{display:block;font-size:13px;color:#D9C9B6;line-height:1.7}
.zone{margin-top:18px;border-radius:24px;padding:18px}
.zone.z1{border:2px dashed #D9B98A;background:color-mix(in srgb,#F3E3CB 50%,var(--ground))}
.zone.z2{border:1px solid var(--line);background:var(--surface)}
.zh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.zh h2{margin:0;font-size:18px}
.zh span{font-size:13px;color:var(--muted)}
.grid-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;min-height:64px}
.erow{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px;cursor:grab;transition:border-color .15s,background .15s,opacity .15s}
.erow.dragging{opacity:.4}
.erow.over{border-color:var(--orange);background:color-mix(in srgb,#FFF1E2 70%,var(--surface))}
.erow .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft)}
.z1 .erow .num{background:var(--brown);color:#fff}
.erow .tile{width:36px;height:36px;border-radius:11px}
.erow .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.4}
.erow .acts{flex:none;display:flex;gap:4px}
.erow .acts button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer}
.erow .acts button:hover:not(:disabled){border-color:var(--brown)}
.erow .acts button:disabled{opacity:.3;cursor:not-allowed}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--brown-deep);color:#fff;border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;box-shadow:0 14px 34px rgba(0,0,0,.3);transition:opacity .25s,transform .25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:20px 0;text-align:center;font-size:13px;color:var(--muted)}

@media (max-width:1100px){.pins{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .hero-in{padding:28px 20px}
  .mosaic{-webkit-mask-image:linear-gradient(to top,transparent 20%,#000 100%);mask-image:linear-gradient(to top,transparent 20%,#000 100%);opacity:.6}
  .row .nm{flex:1}
  .row .ds{display:none}
  .row .brief .in{margin:0 16px 14px}
}
@media (max-width:560px){
  .wrap{padding:0 14px}
  .pins{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-name{display:none}
  kbd{display:none}
  .grid-edit{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

    S('etimad','منصة اعتماد','منصة حكومية لإدارة وتنفيذ الإجراءات والمشتريات والمدفوعات الحكومية إلكترونيًا.','green','badge',['مشتريات','منافسة','عقد','مدفوعات']),
    S('poll','منصة استطلاع الرأي','منصة إلكترونية لإدارة الإقرارات والاستبيانات.','blue','bars',['استبيان','استطلاع','إقرار']),
    S('assets','نظام إدارة الأصول التقنية','نظام إلكتروني لحصر وتوثيق الأصول التقنية وإدارة بياناتها وحالاتها وعهدها ومتابعة التغييرات المرتبطة بها.','blue','laptop',['عهدة','أصول','لابتوب','حاسب','جهاز']),
    S('cityview','منصة سيتي فيو','منصة إلكترونية لعرض وإدارة بيانات ومعلومات المدينة.','green','city',['مدينة','سيتي']),
    S('foras','فرص','منصة إلكترونية لعرض وإدارة الفرص الاستثمارية المتاحة.','orange','trend',['استثمار','فرصة']),
    S('balady','بلدي','بوابة إلكترونية لموظفي الجهات البلدية لإدارة ومتابعة الخدمات والإجراءات الداخلية.','green','globe',['رخصة','بلدية']),
    S('plans','اعتماد المخططات','منصة إلكترونية لإدارة ومتابعة طلبات اعتماد المخططات عبر منصة بلدي.','red','plan',['مخطط','مخططات','أراضي']),
    S('pmo','PMO',TBD,'sand','kanban',['مشاريع','مشروع']),
    S('audit','[اسم الخدمة]','منصة إلكترونية متخصصة في دعم أعمال إدارة المراجعة الداخلية.','red','shield',['مراجعة','تدقيق']),
    S('tasks','[اسم الخدمة]','نظام متابعة تنفيذ المهام وتنسيق الأعمال بين الوكالات وبين مكتب معالي الأمين.','blue','tasks',['مهام','مهمة','تكليف']),
    S('lab','[اسم الخدمة]','نظام إلكتروني لإدارة ومتابعة أعمال المختبر الهندسي.','green','flask',['مختبر','فحص']),
    S('transfer','[اسم الخدمة]','نظام إلكتروني لإدارة طلبات نقل وإعارة الموظفين ومتابعة إجراءاتها إلكترونيًا.','orange','swap',['نقل','إعارة']),
    S('s20','[اسم الخدمة]',TBD,'sand','pin'),
    S('s21','[اسم الخدمة]',TBD,'orange','coin'),
    S('s22','[اسم الخدمة]',TBD,'blue','docs'),
    S('s23','[اسم الخدمة]',TBD,'green','app'),
    S('s24','[اسم الخدمة]',TBD,'red','app'),
    S('midad','منصة مداد','منصة إلكترونية لإدارة ومتابعة أعمال تشغيل المدن.','sand','tri',['تشغيل'],null,true),
    S('raseen','رصين','نظام رصين للجودة.','sand','star',['جودة'],null,true),
    S('l27','[اسم الخدمة]',TBD,'sand','app',[],null,true),
    S('l28','[اسم الخدمة]',TBD,'sand','app',[],null,true),
    S('l29','[اسم الخدمة]',TBD,'sand','app',[],null,true),
    S('l30','[اسم الخدمة]',TBD,'sand','app',[],null,true),
    S('l31','[اسم الخدمة]',TBD,'sand','app',[],null,true),
    S('l32','[اسم الخدمة]',TBD,'sand','app',[],null,true)
  ];
  var BY={};ALL.forEach(function(s){BY[s.id]=s;});
  var AVAIL=ALL.filter(function(s){return !s.locked;}), LOCKED=ALL.filter(function(s){return s.locked;});
  var DEFAULT=AVAIL.map(function(s){return s.id;});
  var PIN_N=6;

  function load(k,f){try{var v=localStorage.getItem('aseer2.'+k);return v?JSON.parse(v):f;}catch(e){return f;}}
  function save(k,v){try{localStorage.setItem('aseer2.'+k,JSON.stringify(v));}catch(e){}}
  var order=load('order',DEFAULT).filter(function(id){return DEFAULT.indexOf(id)>-1;});
  DEFAULT.forEach(function(id){if(order.indexOf(id)<0)order.push(id);});
  var requested=load('requested',{}), view=load('view','grid'), filter='all', draft=null, dragId=null;

  var $=function(id){return document.getElementById(id);};
  var svg=function(d,s,w){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.7)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+'"/></svg>';};
  var vars=function(s){var t=TONES[s.tone];return '--tb:'+t.bg+';--tf:'+t.fg+';--c:'+t.c;};
  var ARROW='M19 12H5 M11 6l-6 6 6 6', CHEV='M6 9l6 6 6-6', LOCK='M6 11h12v9H6z M8 11V8a4 4 0 0 1 8 0v3', CHECK='M5 12l5 5 9-10';
  var rankOf=function(id){return order.indexOf(id)+1;};

  // greeting
  var now=new Date(),h=now.getHours();
  $('hello').textContent=(h<12?'صباح الخير':'مساء الخير')+' يا بيان، وش نخلّص اليوم؟';
  try{
    var g=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);
    var hj=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{day:'numeric',month:'long',year:'numeric'}).format(now);
    $('date').textContent=g+'، الموافق '+hj;
  }catch(e){}

  var tt;function toast(m){$('toastText').textContent=m;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('show');},2600);}
  function openService(id){toast('جارٍ فتح '+BY[id].name);}

  // stats = filters
  function renderStats(){
    var d=[['all','كل الخدمات',ALL.length,'#3A2016'],['avail','متاحة لي',AVAIL.length,'#2E9A55'],['locked','تحتاج صلاحية',LOCKED.length,'#E07A2E']];
    $('stats').innerHTML=d.map(function(x){return '<button class="stat" data-filter="'+x[0]+'" aria-pressed="'+(filter===x[0])+'"><i style="background:'+x[3]+'"></i><b>'+AR(x[2])+'</b><span>'+x[1]+'</span></button>';}).join('');
  }

  function pinsHTML(){
    return order.slice(0,PIN_N).map(function(id,i){var s=BY[id];
      return '<button class="pin" data-open="'+id+'" style="'+vars(s)+'"><span class="rk">'+AR(i+1)+'</span><span class="tile">'+svg(s.icon,22)+'</span><span class="nm">'+s.name+'</span></button>';}).join('');
  }

  function actionHTML(s){
    if(!s.locked) return '<button class="go" data-open="'+s.id+'" aria-label="فتح '+s.name+'">'+svg(ARROW,18,2)+'</button>';
    return requested[s.id]?'<span class="sent" role="status">'+svg(CHECK,15,2.4)+'أُرسل الطلب</span>':'<button class="req" data-req="'+s.id+'">طلب صلاحية</button>';
  }
  function tileHTML(s,sz){return '<span class="tile">'+svg(s.icon,sz)+(s.locked?'<span class="lockb">'+svg(LOCK,11,2.4)+'</span>':'')+'</span>';}
  function briefBtn(s){return '<button class="btn link" aria-expanded="false" aria-controls="b-'+s.id+'" data-brief="'+s.id+'"><span>نبذة</span>'+svg(CHEV,16,2).replace('<svg','<svg class="chev"')+'</button>';}
  function briefBox(s){return '<div class="brief" id="b-'+s.id+'"><div><div class="in">'+s.more+'</div></div></div>';}

  function cardHTML(s){
    var r=s.locked?'':'<span class="rank" aria-label="الأولوية '+AR(rankOf(s.id))+'">'+AR(rankOf(s.id))+'</span>';
    return '<article class="card'+(s.locked?' locked':'')+'" style="'+vars(s)+'"><div class="c-top">'+tileHTML(s,22)+'<h3>'+s.name+'</h3>'+r+'</div><p>'+s.desc+'</p>'+briefBox(s)+'<div class="foot">'+briefBtn(s)+actionHTML(s)+'</div></article>';
  }
  function rowHTML(s){
    var r=s.locked?'':'<span class="rank">'+AR(rankOf(s.id))+'</span>';
    return '<div class="row'+(s.locked?' locked':'')+'" style="'+vars(s)+'"><div class="row-main">'+tileHTML(s,20)+'<span class="nm">'+s.name+'</span><span class="ds">'+s.desc+'</span>'+r+briefBtn(s)+actionHTML(s)+'</div>'+briefBox(s)+'</div>';
  }
  function block(list){
    if(!list.length)return '';
    return view==='grid'?'<div class="grid">'+list.map(cardHTML).join('')+'</div>':'<div class="list">'+list.map(rowHTML).join('')+'</div>';
  }
  function renderServices(){
    var av=order.slice(PIN_N).map(function(id){return BY[id];});
    var html='';
    if(filter==='all'){
      html=block(av)+'<div class="divider">تحتاج صلاحية <small>'+AR(LOCKED.length)+' خدمات، اطلب الوصول لما تحتاجه</small></div>'+block(LOCKED);
      $('allSub').textContent='بقية خدماتك المتاحة حسب ترتيبك، ثم ما يحتاج صلاحية';
    }else if(filter==='avail'){
      html=block(order.map(function(id){return BY[id];}));
      $('allSub').textContent='كل الخدمات المتاحة لك حسب ترتيبك';
    }else{
      html=block(LOCKED);
      $('allSub').textContent='خدمات لا تملك صلاحية الوصول لها حالياً';
    }
    $('services').innerHTML=html;
    document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-view')===view);});
  }
  function renderView(){renderStats();$('pins').innerHTML=pinsHTML();renderServices();}

  // edit
  function erowHTML(id,i,n){var s=BY[id];
    return '<div class="erow" draggable="true" data-id="'+id+'" style="'+vars(s)+'"><span class="num">'+AR(i+1)+'</span><span class="tile">'+svg(s.icon,18)+'</span><span class="nm">'+s.name+'</span><div class="acts">'+
      '<button data-mv="top" '+(i===0?'disabled':'')+' aria-label="نقل '+s.name+' إلى المركز الأول">'+svg('M6 7l5 5-5 5 M12 7l5 5-5 5',18,2)+'</button>'+
      '<button data-mv="up" '+(i===0?'disabled':'')+' aria-label="تقديم '+s.name+'">'+svg('M5 12h14 M13 6l6 6-6 6',18,2)+'</button>'+
      '<button data-mv="down" '+(i===n-1?'disabled':'')+' aria-label="تأخير '+s.name+'">'+svg(ARROW,18,2)+'</button></div></div>';}
  function renderEdit(){var n=draft.length;
    $('eTop').innerHTML=draft.slice(0,PIN_N).map(function(id,i){return erowHTML(id,i,n);}).join('');
    $('eRest').innerHTML=draft.slice(PIN_N).map(function(id,i){return erowHTML(id,i+PIN_N,n);}).join('');}
  function move(id,to){var d=draft.filter(function(x){return x!==id;});d.splice(Math.max(0,Math.min(to,d.length)),0,id);draft=d;renderEdit();
    var el=document.querySelector('.erow[data-id="'+id+'"]');if(el){var b=el.querySelector('button:not(:disabled)');if(b)b.focus();}}
  function setEditing(on){$('view').hidden=on;$('edit').hidden=!on;
    if(on){draft=order.slice();renderEdit();$('edit').scrollIntoView({behavior:'smooth',block:'start'});}else{draft=null;renderView();}}

  document.addEventListener('click',function(e){var t;
    if((t=e.target.closest('[data-open]'))){openService(t.getAttribute('data-open'));closeResults();return;}
    if((t=e.target.closest('[data-brief]'))){var id=t.getAttribute('data-brief'),b=$('b-'+id),o=!b.classList.contains('open');
      b.classList.toggle('open',o);t.setAttribute('aria-expanded',o);t.querySelector('span').textContent=o?'إخفاء':'نبذة';return;}
    if((t=e.target.closest('[data-req]'))){requested[t.getAttribute('data-req')]=true;save('requested',requested);renderServices();toast('أُرسل طلب الصلاحية');return;}
    if((t=e.target.closest('[data-filter]'))){filter=t.getAttribute('data-filter');renderStats();renderServices();
      if(filter!=='all')$('h-all').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if((t=e.target.closest('[data-view]'))){view=t.getAttribute('data-view');save('view',view);renderServices();return;}
    if((t=e.target.closest('[data-mv]'))){var row=t.closest('.erow'),rid=row.getAttribute('data-id'),i=draft.indexOf(rid),mv=t.getAttribute('data-mv');
      move(rid,mv==='top'?0:mv==='up'?i-1:i+1);return;}
    if(!e.target.closest('#cmd'))closeResults();
  });
  $('editBtn').onclick=function(){setEditing(true);};
  $('cancelBtn').onclick=function(){setEditing(false);};
  $('resetBtn').onclick=function(){draft=DEFAULT.slice();renderEdit();};
  $('saveBtn').onclick=function(){order=draft.slice();save('order',order);setEditing(false);window.scrollTo({top:0,behavior:'smooth'});toast('حُفظ ترتيبك');};

  document.addEventListener('dragstart',function(e){var r=e.target.closest&&e.target.closest('.erow');if(!r)return;dragId=r.getAttribute('data-id');r.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);}catch(x){}});
  document.addEventListener('dragend',function(){dragId=null;document.querySelectorAll('.erow').forEach(function(r){r.classList.remove('dragging','over');});});
  document.addEventListener('dragover',function(e){if(!dragId)return;var r=e.target.closest('.erow'),z=e.target.closest('.grid-edit');if(r||z)e.preventDefault();
    document.querySelectorAll('.erow.over').forEach(function(x){if(x!==r)x.classList.remove('over');});
    if(r&&r.getAttribute('data-id')!==dragId)r.classList.add('over');});
  document.addEventListener('drop',function(e){if(!dragId)return;var r=e.target.closest('.erow'),z=e.target.closest('.grid-edit');if(!r&&!z)return;e.preventDefault();
    var from=dragId;dragId=null;
    if(r){var to=r.getAttribute('data-id');if(to!==from){var ti=draft.indexOf(to);draft=draft.filter(function(x){return x!==from;});draft.splice(ti,0,from);}}
    else if(z.id==='eTop'){draft=draft.filter(function(x){return x!==from;});draft.splice(PIN_N-1,0,from);}
    else{draft=draft.filter(function(x){return x!==from;});draft.push(from);}
    renderEdit();});

  // intent search
  var q=$('q'),res=$('results'),hits=[],active=0;
  function norm(s){return (s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();}
  function search(v){var words=norm(v).split(/\s+/).map(function(w){return w.replace(/^ال/,'');}).filter(function(w){return w.length>1;});
    if(!words.length)return [];var out=[];
    ALL.forEach(function(s){if(s.name.charAt(0)==='[' && s.desc===TBD)return;var sc=0,why='',nn=norm(s.name),nd=norm(s.desc);
      words.forEach(function(w){if(nn.indexOf(w)>-1)sc+=10;
        else if(s.kw.some(function(k){var nk=norm(k);return nk.indexOf(w)>-1||w.indexOf(nk)>-1;})){sc+=6;if(!why)why='يناسب «'+w+'»';}
        else if(nd.indexOf(w)>-1)sc+=3;});
      if(sc>0)out.push({s:s,sc:sc,why:why});});
    return out.sort(function(a,b){return b.sc-a.sc;}).slice(0,7);}
  function renderResults(){var v=q.value.trim();if(!v){closeResults();return;}
    hits=search(v);active=0;
    res.innerHTML=hits.length?hits.map(function(h,i){var s=h.s;
      return '<button class="res" role="option" id="opt-'+i+'" aria-selected="'+(i===0)+'" data-hit="'+i+'" style="'+vars(s)+'">'+tileHTML(s,20)+
        '<span style="min-width:0"><span class="t">'+s.name+'</span><span class="d">'+s.desc+'</span></span><span class="why">'+(s.locked?'تحتاج صلاحية':h.why)+'</span></button>';}).join('')
      :'<div class="res-empty">لا توجد خدمة تطابق «'+v.replace(/</g,'&lt;')+'». جرّب اسم النظام أو نوع الطلب.</div>';
    res.classList.add('show');q.setAttribute('aria-expanded','true');q.setAttribute('aria-activedescendant',hits.length?'opt-0':'');}
  function pick(i){var h=hits[i];if(!h)return;if(h.s.locked){toast(h.s.name+' تحتاج صلاحية، اطلبها من قائمة الخدمات');}else openService(h.s.id);q.value='';closeResults();}
  function setActive(i){var o=res.querySelectorAll('.res');if(!o.length)return;active=(i+o.length)%o.length;
    o.forEach(function(x,k){x.setAttribute('aria-selected',k===active);});o[active].scrollIntoView({block:'nearest'});q.setAttribute('aria-activedescendant','opt-'+active);}
  function closeResults(){res.classList.remove('show');q.setAttribute('aria-expanded','false');}
  q.addEventListener('input',renderResults);
  q.addEventListener('focus',function(){if(q.value.trim())renderResults();});
  q.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();setActive(active+1);}
    else if(e.key==='ArrowUp'){e.preventDefault();setActive(active-1);}
    else if(e.key==='Enter'){e.preventDefault();pick(active);}
    else if(e.key==='Escape'){q.value='';closeResults();q.blur();}});
  res.addEventListener('click',function(e){var b=e.target.closest('[data-hit]');if(b){e.stopPropagation();pick(+b.getAttribute('data-hit'));}});
  document.addEventListener('keydown',function(e){var tag=(document.activeElement&&document.activeElement.tagName)||'';
    if(e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA'){e.preventDefault();q.focus();}});

  // Qatt motifs: a soft spotlight reveals the coloured pattern
  (function(){
    var box=$('mosaic'),hero=box.parentNode;
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var cx=.22,cy=.45,tx=cx,ty=cy,r=170,tr=170,user=false,idle,t0=performance.now();
    function set(){box.style.setProperty('--mx',(cx*100).toFixed(2)+'%');box.style.setProperty('--my',(cy*100).toFixed(2)+'%');box.style.setProperty('--r',r.toFixed(0)+'px');}
    hero.addEventListener('pointermove',function(e){var b=hero.getBoundingClientRect();tx=(e.clientX-b.left)/b.width;ty=(e.clientY-b.top)/b.height;user=true;tr=200;clearTimeout(idle);idle=setTimeout(function(){user=false;},1800);if(reduce){cx=tx;cy=ty;set();}});
    hero.addEventListener('pointerleave',function(){user=false;tr=170;});
    if(reduce){set();return;}
    (function tick(now){
      if(!user){var k=(now-t0)/1000;tx=.24+Math.sin(k*.32)*.15;ty=.5+Math.sin(k*.53)*.28;tr=170;}
      cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;r+=(tr-r)*.06;set();requestAnimationFrame(tick);
    })(t0);
  })();

  renderView();
})();
</script>
</body>
</html>
